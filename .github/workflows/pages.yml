name: 部署 GitHub Pages

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/production'
    name: 建置與驗證
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取得原始碼
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 設定 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: 取得 Pages 網址
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 安裝鎖定的相依套件
        run: npm ci
      - name: 執行離線測試
        run: npm test
      - name: 建置正式網站
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: 驗證網站產物
        run: npm run check
      - name: 上傳網站產物
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: 發布網站
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得部署核對腳本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 設定 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: 排除已被取代的發布版本
        id: version
        run: node scripts/artwork-deployment.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 部署 GitHub Pages
        if: steps.version.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: 核對上線版本並回報作品狀態
        if: steps.version.outputs.current == 'true'
        run: node scripts/artwork-deployment.mjs report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ARTWORKS_ENABLED: ${{ vars.ARTWORKS_ENABLED }}
          ARTWORK_API_URL: ${{ secrets.ARTWORK_API_URL }}
          ARTWORK_SITE_ID: ${{ vars.ARTWORK_SITE_ID }}
          ARTWORK_WORKER_SECRET: ${{ secrets.ARTWORK_WORKER_SECRET }}
