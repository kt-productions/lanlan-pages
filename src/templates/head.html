<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fffdf4" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<script>
  // 直接開啟 index.html 時也顯示目錄網址，保留查詢參數與頁內錨點。
  if (location.pathname.endsWith("/index.html")) {
    location.replace(
      location.pathname.slice(0, -10) + location.search + location.hash,
    );
  }
</script>
{{ROBOTS}}
<script id="integration-data" type="application/json">
  {{INTEGRATION_DATA}}
</script>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="zh_TW" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:image" content="{{SITE_URL}}assets/posters/animation-02.webp" />
<meta property="og:url" content="{{PAGE_URL}}" />
<meta name="twitter:card" content="summary_large_image" />
