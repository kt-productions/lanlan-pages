<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    {{HEAD}}
  </head>
  <body>
    {{ICONS}}
    <a class="skip-link" href="#main">跳到主要內容</a>
    {{HEADER}}
    <main id="main" class="wrap order-page progress-page">
      <div class="order-heading">
        <div>
          <h1>委託進度</h1>
          <p>每一份工作，都在這裡慢慢完成。</p>
        </div>
        <a class="button button-primary" href="../commission/"
          >開始填寫委託</a
        >
      </div>
      <p class="order-intro">
        從排隊到交稿，一起看看目前忙到哪裡。Trello 歷史委託沿用原卡片名稱，新表單以編號顯示；交期以繪師個別確認為準。
      </p>
      <div class="order-toolbar">
        <label for="progress-service">委託類型
          <select id="progress-service">
            <option value="">所有類型</option>
            <option value="chibi">小動圖</option>
            <option value="animation">角色動畫</option>
            <option value="stickers">貼圖包</option>
          </select>
        </label>
        <label for="progress-stage">工作階段
          <select id="progress-stage"><option value="">所有階段</option></select>
        </label>
        <label for="progress-flag">附加狀態
          <select id="progress-flag">
            <option value="">所有工作</option>
            <option value="rush">急件</option>
            <option value="on_hold">擱置</option>
          </select>
        </label>
        <button type="button" class="button" id="progress-refresh">
          重新整理
        </button>
      </div>
      <p id="progress-status" role="status">正在讀取委託進度……</p>
      <p class="board-hint" id="board-hint">左右捲動查看各階段，欄內可上下捲動。「急件」與「擱置」可同時標記；擱置仍保留原階段。時間以台灣時間顯示。</p>
      <div id="progress-list" class="progress-board" role="region" tabindex="0" aria-label="委託進度看板" aria-describedby="board-hint"></div>
      <button type="button" class="button" id="progress-more" hidden>
        載入更多
      </button>
      <noscript
        ><p>
          請啟用 JavaScript 讀取最新進度，或透過頁尾的聯絡方式詢問。
        </p></noscript
      >
    </main>
    {{FOOTER}}
  </body>
</html>
